name: CI
on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
  contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    windows:
        name: Windows
        uses: ./.github/workflows/windows-build.yml

    depscan:
        name: Windows dependencies
        needs: windows
        uses: ./.github/workflows/windows-depscan.yml
