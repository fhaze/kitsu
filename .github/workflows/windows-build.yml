name: Windows build
on:
    workflow_call:
        secrets:
            CERTUM_USERNAME:
                required: false
            CERTUM_OTP_URI:
                required: false
        inputs:
            sign:
                description: >-
                    Sign with the Certum certificate (release builds). Otherwise the build signs
                    with a throwaway self-signed certificate, so every build exercises signing.
                type: boolean
                default: false

env:
    CI: 'true'
    PYTHONUTF8: '1'

permissions:
  contents: read

jobs:
    build:
        name: Build Kitsu (MSYS2 UCRT64)
        runs-on: windows-latest
        # The Certum secrets live in the release-signing environment, which should require a
        # reviewer and only allow v* tags (and master, for the signing check workflow).
        # See "Code signing" in AGENTS.md.
        environment:
            name: ${{ inputs.sign && 'release-signing' || 'windows-build' }}
            deployment: false
        # TOTP codes are single use and SimplySign locks the account after repeated rejections,
        # so never run two Certum logins at once
        concurrency:
            group: ${{ inputs.sign && 'certum-simplysign' || format('windows-build-{0}-{1}', github.run_id, github.run_attempt) }}
            cancel-in-progress: false
        defaults:
            run:
                shell: msys2 {0}
        steps:
          - name: Checkout source code
            uses: actions/checkout@v7.0.1
            with:
              fetch-depth: 10
              persist-credentials: false

          - name: Install Go
            uses: actions/setup-go@v7.0.0
            with:
              go-version-file: go.mod

          - name: Set up MSYS2 UCRT64
            uses: msys2/setup-msys2@v2.32.0
            with:
              msystem: UCRT64
              update: true
              path-type: inherit
              install: >-
                make git ncurses unzip
                mingw-w64-ucrt-x86_64-gcc
                mingw-w64-ucrt-x86_64-pkgconf
                mingw-w64-ucrt-x86_64-python
                mingw-w64-ucrt-x86_64-freetype
                mingw-w64-ucrt-x86_64-harfbuzz
                mingw-w64-ucrt-x86_64-libpng
                mingw-w64-ucrt-x86_64-lcms2
                mingw-w64-ucrt-x86_64-xxhash
                mingw-w64-ucrt-x86_64-openssl
                mingw-w64-ucrt-x86_64-zlib
                mingw-w64-ucrt-x86_64-cairo
                mingw-w64-ucrt-x86_64-fontconfig
                mingw-w64-ucrt-x86_64-meson
                mingw-w64-ucrt-x86_64-gperf
                mingw-w64-ucrt-x86_64-mesa
                mingw-w64-ucrt-x86_64-libsystre

          - name: Install SIMDe headers (not packaged by MSYS2)
            run: |
              tmp=$(cygpath -u "$RUNNER_TEMP")
              curl -fsSL -o simde.tar.gz https://github.com/simd-everywhere/simde/archive/refs/tags/v0.8.2.tar.gz
              tar -xzf simde.tar.gz -C "$tmp"
              echo "CPPFLAGS=-I$(cygpath -m "$tmp/simde-0.8.2")" >> "$GITHUB_ENV"

          - name: Install slang shader compiler
            run: |
              tmp=$(cygpath -u "$RUNNER_TEMP")
              curl -fsSL -o slang.zip https://github.com/shader-slang/slang/releases/download/v2026.14.1/slang-2026.14.1-windows-x86_64.zip
              mkdir -p "$tmp/slang" && unzip -qo slang.zip -d "$tmp/slang"
              echo "SLANGC=$(cygpath -m "$tmp/slang/bin/slangc.exe")" >> "$GITHUB_ENV"

          - name: Install Symbols Nerd Font Mono
            run: |
              curl -fsSL -o nerd.zip https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip
              fontdir=$(cygpath -u "$LOCALAPPDATA")/Microsoft/Windows/Fonts
              mkdir -p "$fontdir"
              unzip -qo -j nerd.zip SymbolsNerdFontMono-Regular.ttf -d "$fontdir"
              fc-cache -f >/dev/null
              fc-list :postscriptname=SymbolsNFM | grep -q . || { echo 'Nerd font not visible to fontconfig'; exit 1; }

          - name: Install Inno Setup
            shell: pwsh
            run: |
              if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
                choco install innosetup -y --no-progress
              }
              (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion

          - name: Test dependency inventory and signing helpers
            run: |
              python -m unittest discover -s .github/workflows -p 'test_windows_dependencies.py'
              python -m unittest discover -s windows -p 'test_python_runtime.py'
              python -m unittest discover -s windows -p 'test_python_ssl_build.py'
              python -m unittest discover -s windows -p 'test_signing.py'
              pwsh -NoProfile -File windows/Connect-SimplySign.ps1 -SelfTest

          - name: Create a throwaway test signing certificate
            if: ${{ !inputs.sign }}
            id: testcert
            shell: pwsh
            run: |
              # Trusted on this runner only, so the signatures verify as Valid here and nowhere else
              $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Kitsu CI Test Signing' `
                -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
              $cer = Join-Path $env:RUNNER_TEMP 'kitsu-test-signing.cer'
              Export-Certificate -Cert $cert -FilePath $cer | Out-Null
              Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
              "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

          - name: Open the SimplySign session
            if: ${{ inputs.sign }}
            shell: pwsh
            env:
              CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
              CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
              CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
            run: ./windows/Connect-SimplySign.ps1

          - name: Prepare the sign command
            id: sign
            shell: pwsh
            env:
              THUMBPRINT: ${{ inputs.sign && vars.CERTUM_CERT_SHA1 || steps.testcert.outputs.thumbprint }}
              TIMESTAMP: ${{ inputs.sign && 'http://time.certum.pl' || '' }}
            run: |
              # The x64 signtool: the ARM64 one cannot use SimplySign's 64-bit minidriver
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $signtool) { throw 'signtool.exe not found' }
              $thumbprint = ($env:THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
              if (-not $thumbprint) { throw 'No signing certificate thumbprint, set the CERTUM_CERT_SHA1 variable of the release-signing environment' }
              # Inno Setup SignTool syntax, see windows/signing.py
              $cmd = "`$q$($signtool.FullName)`$q sign /fd sha256 /sha1 $thumbprint /d Kitsu /du https://github.com/$env:GITHUB_REPOSITORY"
              if ($env:TIMESTAMP) { $cmd += " /tr $env:TIMESTAMP /td sha256" }
              "command=$cmd `$f" >> $env:GITHUB_OUTPUT
              "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

          - name: Build Windows package
            id: pkg
            env:
              KITTY_RELEASE_TAG: ${{ github.ref_name }}
              KITSU_SIGN_COMMAND: ${{ steps.sign.outputs.command }}
              MSYS2_ENV_CONV_EXCL: KITSU_SIGN_COMMAND
            run: |
              python setup.py windows-package
              zip=$(ls windows-package/kitsu-*-windows-*.zip)
              echo "zip=$zip" >> "$GITHUB_OUTPUT"
              setup=$(ls windows-package/kitsu-*-windows-*-setup.exe)
              echo "setup=$setup" >> "$GITHUB_OUTPUT"

          - name: Close the SimplySign session
            if: ${{ always() && inputs.sign }}
            shell: pwsh
            run: Get-Process -Name SimplySignDesktop -ErrorAction SilentlyContinue | Stop-Process -Force

          - name: Verify Authenticode signatures
            env:
              THUMBPRINT: ${{ steps.sign.outputs.thumbprint }}
            run: |
              python windows/signing.py verify windows-package/kitsu "${{ steps.pkg.outputs.setup }}" \
                --thumbprint "$THUMBPRINT" ${{ inputs.sign && '--require-timestamp' || '' }}

          - name: Test Windows console and TUI key handling
            run: |
              go test ./tools/tty ./tools/tui/loop ./tools/tui/readline ./kittens/choose_files
              go vet ./tools/tty ./tools/tui/loop ./tools/tui/readline ./kittens/choose_files

          - name: Test Windows command-line splitting and shell resolution
            run: |
              go test ./tools/utils/shlex ./tools/tui
              go vet ./tools/utils/shlex ./tools/tui

          - name: Test ConPTY child UTF-8 code pages and escape payloads
            run: python windows/test_console_utf8.py windows-package/kitsu

          - name: Test Windows config reload IPC and kitten error reporting
            run: |
              go test ./tools/config ./tools/watch ./tools/themes ./kittens/choose_fonts
              go vet ./tools/config ./tools/watch ./tools/themes ./kittens/choose_fonts

          - name: Verify Kitsu branding and embedded executable icons
            run: python windows/test_branding.py windows-package/kitsu

          - name: Test DLL-free PATH launchers
            run: python windows/test_path_launchers.py windows-package/kitsu -v

          - name: Test GUI logging and detached logs
            run: python windows/test_logging.py windows-package/kitsu -v

          - name: Test Unicode and long path handling
            run: |
              gcc -std=gnu11 -Wall -Wextra -Werror -D_FILE_OFFSET_BITS=64 -Ikitty windows/test_win32_compat.c kitty/win32-compat.c -o build/test-win32-compat.exe -lws2_32 -liphlpapi -lbcrypt -ladvapi32 -lwtsapi32 -lshell32
              ./build/test-win32-compat.exe
              python windows/test_unicode_paths.py windows-package/kitsu

          - name: Test Windows IPC peer ownership
            run: |
              gcc -std=gnu11 -Wall -Wextra -Werror -D_FILE_OFFSET_BITS=64 -Ikitty windows/test_ipc_peers.c -o build/test-ipc-peers.exe -lws2_32 -liphlpapi -lbcrypt -ladvapi32 -lwtsapi32 -lshell32
              ./build/test-ipc-peers.exe

          - name: Test that GLFW leaves the foreground lock timeout alone
            run: python windows/test_foreground_lock.py windows-package/kitsu

          - name: Test raw Windows wheel deltas
            run: python windows/test_scroll.py windows-package/kitsu

          - name: Test Win32 modal loop dispatch and live resize
            run: python windows/test_modal_loop.py windows-package/kitsu

          - name: Test private Mesa OpenGL fallback
            run: python windows/test_opengl.py windows-package/kitsu -v

          - name: Test the Win32 primary selection and clipboard isolation
            run: python windows/test_primary_selection.py windows-package/kitsu

          - name: Test exact Win32 binary clipboard lengths
            run: python windows/test_clipboard.py windows-package/kitsu

          - name: Smoke test the packaged executables
            shell: cmd
            run: |
              cd windows-package\kitsu\bin
              rem kitsu.exe is a GUI subsystem executable, cmd.exe only waits for it with start /wait
              start "" /b /wait kitsu.exe --version || exit /b 1
              kitten.exe --version || exit /b 1
              start "" /b /wait kitsu.exe +runpy "import ssl, sqlite3, kitty.fast_data_types" || exit /b 1
              rem custom shaders are compiled at runtime by the bundled slangc
              slangc.exe -version || exit /b 1
              rem WSL distros look up the terminfo under x\ not the hex encoded 78\ that tic writes on Windows
              if not exist ..\lib\kitty\terminfo\x\xterm-kitty exit /b 1
              if not exist ..\lib\kitty\terminfo\78\xterm-kitty exit /b 1
              rem Linux kittens for WSL, installed by kitty +wsl-setup
              if not exist ..\lib\kitty\windows\wsl\install-kitten.sh exit /b 1
              if not exist ..\lib\kitty\windows\wsl\kitten-linux-amd64 exit /b 1
              if not exist ..\lib\kitty\windows\wsl\kitten-linux-arm64 exit /b 1
              python -c "from pathlib import Path; bad = [str(p) for p in Path(r'..\lib\kitty\shell-integration').rglob('*') if p.is_file() and b'\r\n' in p.read_bytes()]; assert not bad, bad"

          - name: Test bundled Python security fixes
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import runpy; runpy.run_path('.github/workflows/test_windows_runtime.py', run_name='__main__')"

          - name: Test bundled Python TLS security fix offline
            shell: cmd
            env:
              KITSU_SSL_TEST_MODULE: ${{ github.workspace }}/windows-package/kitsu/lib/python3.14/lib-dynload
              KITSU_SSL_TEST_CERTS: ${{ github.workspace }}/build/python-ssl/Python-3.14.10/Lib/test/certdata
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import runpy; runpy.run_path('windows/test_python_ssl.py', run_name='__main__')"

          - name: Test updates and notification policy
            shell: cmd
            run: |
              start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','--module','update']; main()"
              if errorlevel 1 exit /b 1
              start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','--module','notifications']; main()"

          - name: Test native notification XML and event dispatch (no UI)
            run: |
              gcc -std=gnu11 -Wall -Wextra -Werror -Wno-missing-field-initializers $(python3-config --includes) windows/test_notifications.c -o build/test-notifications.exe $(python3-config --embed --ldflags) -lruntimeobject -lole32 -lshlwapi -lshell32 -ladvapi32 -luuid
              ./build/test-notifications.exe

          - name: Test Windows ConPTY reset modes
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','win32_input_mode','reset_conpty_modes']; main()"

          - name: Test Windows DIP window sizes
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','--module','glfw']; main()"

          - name: Test Windows synthetic key input
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','--module','keys']; main()"

          - name: Test Windows Unicode packets without hardware key identities
            run: python windows/test_unicode_packets.py windows-package/kitsu

          - name: Test Windows graphics replies
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','--module','graphics']; main()"

          - name: Test stock Windows pager and editor defaults
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','--module','windows_defaults']; main()"

          - name: Test Windows keyboard protocol negotiation
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','win32_input_keyboard_protocol','key_encoding_flags_stack','encode_win32_key_event']; main()"

          - name: Test Windows icat launcher
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','--module','options','icat_launcher']; main()"

          - name: Test Windows terminfo environment
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','terminfo_environment','wslenv']; main()"

          - name: Test batch file arguments, image file paths, file modes for remote hosts, dropped paths and the default font
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','windows_batch_file_arguments','windows_batch_file_arguments_outside_windows','windows_image_path_policy','file_metadata_permissions','windows_dropped_paths','windows_default_monospace_font']; main()"

          - name: Test Windows default URL opening with the GUI running
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import os,sys; sys.path.insert(0,os.getcwd()); from kitty_tests.main import main; sys.argv=['test.py','open_url','windows_default_url_opening','windows_shell_open_with_gui_running']; main()"

          - name: Test file modes and identities sent to remote hosts
            run: go test ./tools/tui/shell_integration ./tools/utils ./kittens/ssh ./kittens/transfer -run 'TestEmbeddedFileModes|TestPosixPermissions|TestCopiedFileModes|TestSendPermissions|TestFileIdentity|TestCopyFolderFileIdentity|TestCopiedFileIdentity|TestSendFileIdentity'

          - name: Test batch file arguments from kittens
            run: |
              go test ./tools/utils -run 'TestIsBatchFile|TestBatchCommandLine|TestCommandRunsBatchFilesSafely'
              go test ./tools/utils/images -run 'TestMagickBatchFilesAreNotUsed'
              go vet ./tools/utils/... ./tools/tui ./kittens/choose_files ./kittens/remote_file ./kittens/diff ./kittens/hyperlinked_grep

          - name: Record shipped MSYS2 dependencies
            run: python .github/workflows/windows_dependencies.py windows-package/kitsu windows-runtime.cdx.json "${{ steps.pkg.outputs.zip }}"

          - name: Upload Windows dependency inventory
            uses: actions/upload-artifact@v7.0.1
            with:
              name: windows-runtime-sbom
              path: |
                windows-runtime.cdx.json
                windows-runtime.vex.json
              if-no-files-found: error

          - name: Health-check quick diagnostics (packaged runtime)
            shell: pwsh
            run: |
              & ./windows-package/kitsu/bin/health-check.ps1 -Format json > health-check.json
              if ($LASTEXITCODE -ne 0) { Get-Content health-check.json; exit $LASTEXITCODE }

          - name: Upload health-check report
            if: always()
            uses: actions/upload-artifact@v7.0.1
            with:
              name: windows-health-check
              path: health-check.json
              if-no-files-found: ignore

          - name: Smoke test the installer (install, upgrade, uninstall)
            env:
              # keep /VERYSILENT etc. from being turned into paths by the MSYS2 shell
              MSYS2_ARG_CONV_EXCL: '*'
              THUMBPRINT: ${{ steps.sign.outputs.thumbprint }}
            run: |
              set -ex
              setup=$(ls windows-package/kitsu-*-windows-*-setup.exe)
              tmp=$(cygpath -w "$RUNNER_TEMP")
              dir="$tmp\\kitty-install"
              uninstall_key='HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7D0F3A2B-5C4E-4F19-9B6A-2E8D1C3F5A70}_is1'

              "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=addtopath /DIR="$dir" /LOG="$tmp\\kitty-setup-1.log"
              "$dir\\cmd\\kitten.exe" --version
              "$dir\\cmd\\kitsu.com" --version
              # the installed files, and the uninstaller Inno Setup signed while compiling
              python windows/signing.py verify "$dir" "$dir\\unins000.exe" --thumbprint "$THUMBPRINT"
              test -e "$dir\\lib\\kitty\\windows\\wsl\\kitten-linux-amd64"
              reg query 'HKCU\Environment' /v Path | grep -F "kitty-install\\cmd"
              reg query 'HKCU\Environment' /v Path | grep -F "kitty-install\\bin" && exit 1

              # Simulate a legacy install: bin on PATH, including duplicate/case/trailing-slash variants.
              python -c 'import sys, winreg; d=sys.argv[1]; k=winreg.OpenKey(winreg.HKEY_CURRENT_USER,"Environment",0,winreg.KEY_ALL_ACCESS); p,t=winreg.QueryValueEx(k,"Path"); p=p.replace(d+"\\cmd",d+"\\bin"); winreg.SetValueEx(k,"Path",0,t,p+";"+d.upper()+"\\BIN\\")' "$dir"

              # A newer installer must upgrade in place: same directory and tasks, stale files removed.
              echo stale > "$dir\\lib\\stale.py"
              echo stale > "$dir\\cmd\\stale.dll"
              iscc=$(cygpath -u "$(python -c 'import setup; print(setup.find_iscc())')")
              "$iscc" /Qp /DAppVersion=99.0.0 /DArch=x86_64 "/DSourceDir=$(cygpath -aw windows-package/kitsu)" "/DOutputDir=$tmp" "$(cygpath -aw windows/kitty.iss)"
              "$tmp\\kitsu-99.0.0-windows-x86_64-setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /LOG="$tmp\\kitty-setup-2.log"
              test ! -e "$dir\\lib\\stale.py"
              test ! -e "$dir\\cmd\\stale.dll"
              "$dir\\cmd\\kitten.exe" --version
              "$dir\\cmd\\kitsu.exe" --version
              reg query "$uninstall_key" /v DisplayVersion | grep -F 99.0.0
              test "$(reg query 'HKCU\Environment' /v Path | grep -oF "kitty-install\\cmd" | wc -l)" -eq 1
              reg query 'HKCU\Environment' /v Path | grep -iF 'kitty-install\bin' && exit 1

              # Deselecting the task removes both old and new entries; selecting it again is idempotent.
              "$tmp\\kitsu-99.0.0-windows-x86_64-setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=""
              reg query 'HKCU\Environment' /v Path | grep -iF 'kitty-install\' && exit 1
              for i in 1 2; do
                "$tmp\\kitsu-99.0.0-windows-x86_64-setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=addtopath
              done
              test "$(reg query 'HKCU\Environment' /v Path | grep -oF "kitty-install\\cmd" | wc -l)" -eq 1

              "$dir\\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
              # the uninstaller hands over to a copy of itself in %TEMP% and returns before that finishes
              for i in $(seq 20); do
                reg query 'HKCU\Environment' /v Path | grep -qiF 'kitty-install\' || break
                sleep 3
              done
              test ! -e "$dir\\bin"
              test ! -e "$dir\\cmd"
              reg query "$uninstall_key" && exit 1
              reg query 'HKCU\Environment' /v Path | grep -iF 'kitty-install\' && exit 1
              echo installer OK

          - name: Upload package artifact
            uses: actions/upload-artifact@v7.0.1
            with:
              name: kitsu-windows-x86_64
              path: |
                ${{ steps.pkg.outputs.zip }}
                ${{ steps.pkg.outputs.setup }}
              if-no-files-found: error
