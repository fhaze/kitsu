name: Windows build
on:
    workflow_call:

env:
    CI: 'true'
    PYTHONUTF8: '1'

permissions:
  contents: read

jobs:
    build:
        name: Build Kitsu (MSYS2 UCRT64)
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
          - name: Checkout source code
            uses: actions/checkout@v7.0.1
            with:
              fetch-depth: 10
              persist-credentials: false

          - name: Install Go
            uses: actions/setup-go@v7.0.0
            with:
              go-version-file: go.mod

          - name: Set up MSYS2 UCRT64
            uses: msys2/setup-msys2@v2.32.0
            with:
              msystem: UCRT64
              update: true
              path-type: inherit
              install: >-
                make git ncurses unzip
                mingw-w64-ucrt-x86_64-gcc
                mingw-w64-ucrt-x86_64-pkgconf
                mingw-w64-ucrt-x86_64-python
                mingw-w64-ucrt-x86_64-freetype
                mingw-w64-ucrt-x86_64-harfbuzz
                mingw-w64-ucrt-x86_64-libpng
                mingw-w64-ucrt-x86_64-lcms2
                mingw-w64-ucrt-x86_64-xxhash
                mingw-w64-ucrt-x86_64-openssl
                mingw-w64-ucrt-x86_64-zlib
                mingw-w64-ucrt-x86_64-cairo
                mingw-w64-ucrt-x86_64-fontconfig
                mingw-w64-ucrt-x86_64-mesa
                mingw-w64-ucrt-x86_64-libsystre

          - name: Install SIMDe headers (not packaged by MSYS2)
            run: |
              tmp=$(cygpath -u "$RUNNER_TEMP")
              curl -fsSL -o simde.tar.gz https://github.com/simd-everywhere/simde/archive/refs/tags/v0.8.2.tar.gz
              tar -xzf simde.tar.gz -C "$tmp"
              echo "CPPFLAGS=-I$(cygpath -m "$tmp/simde-0.8.2")" >> "$GITHUB_ENV"

          - name: Install slang shader compiler
            run: |
              tmp=$(cygpath -u "$RUNNER_TEMP")
              curl -fsSL -o slang.zip https://github.com/shader-slang/slang/releases/download/v2026.14.1/slang-2026.14.1-windows-x86_64.zip
              mkdir -p "$tmp/slang" && unzip -qo slang.zip -d "$tmp/slang"
              echo "SLANGC=$(cygpath -m "$tmp/slang/bin/slangc.exe")" >> "$GITHUB_ENV"

          - name: Install Symbols Nerd Font Mono
            run: |
              curl -fsSL -o nerd.zip https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip
              fontdir=$(cygpath -u "$LOCALAPPDATA")/Microsoft/Windows/Fonts
              mkdir -p "$fontdir"
              unzip -qo -j nerd.zip SymbolsNerdFontMono-Regular.ttf -d "$fontdir"
              fc-cache -f >/dev/null
              fc-list :postscriptname=SymbolsNFM | grep -q . || { echo 'Nerd font not visible to fontconfig'; exit 1; }

          - name: Install Inno Setup
            shell: pwsh
            run: |
              if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
                choco install innosetup -y --no-progress
              }
              (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion

          - name: Test dependency inventory
            run: |
              python -m unittest discover -s .github/workflows -p 'test_windows_dependencies.py'
              python -m unittest discover -s windows -p 'test_python_runtime.py'

          - name: Build Windows package
            id: pkg
            env:
              KITTY_RELEASE_TAG: ${{ github.ref_name }}
            run: |
              python setup.py windows-package
              zip=$(ls windows-package/kitsu-*-windows-*.zip)
              echo "zip=$zip" >> "$GITHUB_OUTPUT"
              setup=$(ls windows-package/kitsu-*-windows-*-setup.exe)
              echo "setup=$setup" >> "$GITHUB_OUTPUT"

          - name: Test Windows console and TUI key handling
            run: |
              go test ./tools/tty ./tools/tui/loop ./tools/tui/readline ./kittens/choose_files
              go vet ./tools/tty ./tools/tui/loop ./tools/tui/readline ./kittens/choose_files

          - name: Verify Kitsu branding and embedded executable icons
            run: python windows/test_branding.py windows-package/kitsu

          - name: Smoke test the packaged executables
            shell: cmd
            run: |
              cd windows-package\kitsu\bin
              rem kitsu.exe is a GUI subsystem executable, cmd.exe only waits for it with start /wait
              start "" /b /wait kitsu.exe --version || exit /b 1
              kitten.exe --version || exit /b 1
              start "" /b /wait kitsu.exe +runpy "import ssl, sqlite3, kitty.fast_data_types" || exit /b 1
              rem custom shaders are compiled at runtime by the bundled slangc
              slangc.exe -version || exit /b 1
              rem WSL distros look up the terminfo under x\ not the hex encoded 78\ that tic writes on Windows
              if not exist ..\lib\kitty\terminfo\x\xterm-kitty exit /b 1
              if not exist ..\lib\kitty\terminfo\78\xterm-kitty exit /b 1
              rem Linux kittens for WSL, installed by kitty +wsl-setup
              if not exist ..\lib\kitty\windows\wsl\install-kitten.sh exit /b 1
              if not exist ..\lib\kitty\windows\wsl\kitten-linux-amd64 exit /b 1
              if not exist ..\lib\kitty\windows\wsl\kitten-linux-arm64 exit /b 1
              python -c "from pathlib import Path; bad = [str(p) for p in Path(r'..\lib\kitty\shell-integration').rglob('*') if p.is_file() and b'\r\n' in p.read_bytes()]; assert not bad, bad"

          - name: Test bundled Python security fixes
            shell: cmd
            run: start "" /b /wait windows-package\kitsu\bin\kitsu.exe +runpy "import runpy; runpy.run_path('.github/workflows/test_windows_runtime.py', run_name='__main__')"

          - name: Record shipped MSYS2 dependencies
            run: python .github/workflows/windows_dependencies.py windows-package/kitsu windows-runtime.cdx.json "${{ steps.pkg.outputs.zip }}"

          - name: Upload Windows dependency inventory
            uses: actions/upload-artifact@v7.0.1
            with:
              name: windows-runtime-sbom
              path: |
                windows-runtime.cdx.json
                windows-runtime.vex.json
              if-no-files-found: error

          - name: Health-check quick diagnostics (packaged runtime)
            shell: pwsh
            run: |
              & ./windows-package/kitsu/bin/health-check.ps1 -Format json > health-check.json
              if ($LASTEXITCODE -ne 0) { Get-Content health-check.json; exit $LASTEXITCODE }

          - name: Upload health-check report
            if: always()
            uses: actions/upload-artifact@v7.0.1
            with:
              name: windows-health-check
              path: health-check.json
              if-no-files-found: ignore

          - name: Smoke test the installer (install, upgrade, uninstall)
            env:
              # keep /VERYSILENT etc. from being turned into paths by the MSYS2 shell
              MSYS2_ARG_CONV_EXCL: '*'
            run: |
              set -ex
              setup=$(ls windows-package/kitsu-*-windows-*-setup.exe)
              tmp=$(cygpath -w "$RUNNER_TEMP")
              dir="$tmp\\kitty-install"
              uninstall_key='HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7D0F3A2B-5C4E-4F19-9B6A-2E8D1C3F5A70}_is1'

              "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=addtopath /DIR="$dir" /LOG="$tmp\\kitty-setup-1.log"
              "$dir\\bin\\kitten.exe" --version
              test -e "$dir\\lib\\kitty\\windows\\wsl\\kitten-linux-amd64"
              reg query 'HKCU\Environment' /v Path | grep -F "kitty-install\\bin"

              # A newer installer must upgrade in place: same directory and tasks, stale files removed
              echo stale > "$dir\\lib\\stale.py"
              iscc=$(cygpath -u "$(python -c 'import setup; print(setup.find_iscc())')")
              "$iscc" /Qp /DAppVersion=99.0.0 /DArch=x86_64 "/DSourceDir=$(cygpath -aw windows-package/kitsu)" "/DOutputDir=$tmp" "$(cygpath -aw windows/kitty.iss)"
              "$tmp\\kitsu-99.0.0-windows-x86_64-setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /LOG="$tmp\\kitty-setup-2.log"
              test ! -e "$dir\\lib\\stale.py"
              "$dir\\bin\\kitten.exe" --version
              reg query "$uninstall_key" /v DisplayVersion | grep -F 99.0.0
              test "$(reg query 'HKCU\Environment' /v Path | grep -oF "kitty-install\\bin" | wc -l)" -eq 1

              "$dir\\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
              # the uninstaller hands over to a copy of itself in %TEMP% and returns before that finishes
              for i in $(seq 20); do
                reg query 'HKCU\Environment' /v Path | grep -qF "kitty-install\\bin" || break
                sleep 3
              done
              test ! -e "$dir\\bin"
              reg query "$uninstall_key" && exit 1
              reg query 'HKCU\Environment' /v Path | grep -F "kitty-install\\bin" && exit 1
              echo installer OK

          - name: Upload package artifact
            uses: actions/upload-artifact@v7.0.1
            with:
              name: kitsu-windows-x86_64
              path: |
                ${{ steps.pkg.outputs.zip }}
                ${{ steps.pkg.outputs.setup }}
              if-no-files-found: error
