name: Windows dependency scan
on:
    workflow_call:

permissions:
  contents: read

jobs:
    scan:
        name: Scan shipped Windows dependencies
        runs-on: ubuntu-latest
        steps:
          - name: Checkout scan input validation
            uses: actions/checkout@v7.0.1
            with:
              persist-credentials: false

          - name: Install Syft for binary inventory
            id: syft
            uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
            with:
              syft-version: v1.42.3

          - name: Download Windows package
            uses: actions/download-artifact@v8.0.1
            with:
              name: kitty-windows-x86_64
              path: windows-artifacts

          - name: Download Windows dependency inventory
            uses: actions/download-artifact@v8.0.1
            with:
              name: windows-runtime-sbom
              path: windows-inventory

          - name: Extract the portable package
            run: |
              set -euo pipefail
              packages=(windows-artifacts/kitty-*-windows-*.zip)
              test "${#packages[@]}" -eq 1
              unzip -q "${packages[0]}" -d windows-package
              test -f windows-package/kitty/bin/kitty.exe

          - name: Inventory packaged binaries (including WSL kittens)
            run: |
              set -euo pipefail
              version=$(sha256sum windows-artifacts/kitty-*-windows-*.zip | cut -d' ' -f1)
              "${{ steps.syft.outputs.cmd }}" dir:windows-package/kitty --source-name kitty-windows --source-version "$version" -o syft-json=windows-binaries.syft.json
              python3 .github/workflows/windows_dependencies.py --verify-scan-inputs windows-artifacts/kitty-*-windows-*.zip windows-inventory/windows-runtime.cdx.json windows-binaries.syft.json windows-inventory/windows-runtime.vex.json

          - name: Scan packaged binaries (including WSL kittens)
            id: binaries
            uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
            with:
              sbom: windows-binaries.syft.json
              vex: windows-inventory/windows-runtime.vex.json
              output-format: json
              output-file: windows-binaries.grype.json
              severity-cutoff: medium
              only-fixed: true
              add-cpes-if-none: true
              by-cve: true

          - name: Scan shipped MSYS2 runtime versions
            if: ${{ !cancelled() && steps.binaries.outcome != 'skipped' }}
            uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
            with:
              sbom: windows-inventory/windows-runtime.cdx.json
              vex: windows-inventory/windows-runtime.vex.json
              output-format: json
              output-file: windows-runtime.grype.json
              severity-cutoff: medium
              only-fixed: true
              add-cpes-if-none: true
              by-cve: true

          - name: Summarize vulnerability reports
            if: always()
            run: |
              python3 - <<'PY'
              import json
              import os
              from pathlib import Path

              lines = ['## Windows dependency scan', '', '| Report | Package | Version | Vulnerability | Severity | Fixed in |', '| --- | --- | --- | --- | --- | --- |']
              for path in sorted(Path('.').glob('windows-*.grype.json')):
                  report = json.loads(path.read_text())
                  rows = set()
                  for match in report['matches']:
                      package, vuln = match['artifact'], match['vulnerability']
                      rows.add((package['name'], package['version'], vuln['id'], vuln['severity'], ', '.join(vuln.get('fix', {}).get('versions', []))))
                  for row in sorted(rows):
                      lines.append('| ' + ' | '.join((path.name, *row)) + ' |')
                  if not rows:
                      lines.append(f'| {path.name} | No fixed vulnerabilities found | | | | |')
              lines.extend(['', '## Verified vendor fixes (OpenVEX)', '', '| Report | Package | Version | Vulnerability |', '| --- | --- | --- | --- |'])
              for path in sorted(Path('.').glob('windows-*.grype.json')):
                  fixed = set()
                  for match in json.loads(path.read_text()).get('ignoredMatches', []):
                      if any(rule.get('vex-status') == 'fixed' for rule in match['appliedIgnoreRules']):
                          package, vuln = match['artifact'], match['vulnerability']
                          fixed.add((package['name'], package['version'], vuln['id']))
                  for row in sorted(fixed):
                      lines.append('| ' + ' | '.join((path.name, *row)) + ' |')
              summary = '\n'.join(lines) + '\n'
              print(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(summary)
              PY

          - name: Upload vulnerability reports
            if: always()
            uses: actions/upload-artifact@v7.0.1
            with:
              name: windows-depscan-reports
              path: |
                windows-inventory/windows-runtime.cdx.json
                windows-inventory/windows-runtime.vex.json
                windows-binaries.syft.json
                windows-*.grype.json
              if-no-files-found: warn
