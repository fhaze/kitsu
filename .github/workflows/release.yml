name: Release
on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
        name: Windows
        uses: ./.github/workflows/windows-build.yml

    depscan:
        name: Windows dependencies
        needs: build
        uses: ./.github/workflows/windows-depscan.yml

    release:
        name: Publish GitHub release
        needs: [build, depscan]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
          - name: Download Windows package artifact
            uses: actions/download-artifact@v8.0.1
            with:
              name: kitty-windows-x86_64

          - name: Create release
            env:
              GH_TOKEN: ${{ github.token }}
            run: |
              gh release create "$GITHUB_REF_NAME" kitty-*-windows-*-setup.exe kitty-*-windows-*.zip \
                --repo "$GITHUB_REPOSITORY" \
                --title "kitty $GITHUB_REF_NAME" \
                --notes 'Windows downloads: use the .exe installer for installation and WSL kitten setup, or the .zip for portable use. Standalone kitten binaries are not published; use the installer and kitty +wsl-setup for WSL.' \
                --generate-notes
