<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<description>Prefer the monospace fonts that ship with Windows</description>
	<!--
	  The stock 60-latin.conf ends up at Courier New on Windows, as the fonts it
	  prefers are not installed. Cascadia Mono is the default of Windows Terminal
	  and ships with Windows 11, Consolas and Lucida Console with every Windows.
	  This comes after 50-user.conf so that user configuration still wins.
	-->
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Cascadia Mono</family>
			<family>Consolas</family>
			<family>Lucida Console</family>
		</prefer>
	</alias>
</fontconfig>
